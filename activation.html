<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
Connection Settings
</title>

<link
  rel="stylesheet"
  href="style.css"
>

</head>


<body>


<div class="page">

<div class="card wide">


<!-- ======================================================
     TOP BAR
======================================================= -->

<div class="topbar">

<div>

<div class="brand">
ADMIN
</div>

<h1>
Connection Settings
</h1>

</div>


<button
  id="logoutButton"
  class="secondary small"
  type="button"
>
Logout
</button>

</div>


<!-- ======================================================
     CONNECTION INFORMATION
======================================================= -->

<div class="connection-info">

<div class="info-label">
Google Apps Script
</div>

<div
  id="scriptDisplay"
  class="script-display"
>
Loading...
</div>

</div>


<!-- ======================================================
     CONNECTION STATUS
======================================================= -->

<div class="status-box">

<span
  id="statusDot"
  class="status-dot inactive"
></span>

<span id="statusText">
CHECKING...
</span>

</div>


<!-- ======================================================
     BUTTONS
======================================================= -->

<div class="button-grid">

<button
  id="activateButton"
  class="activate"
  type="button"
  disabled
>
Activate
</button>


<button
  id="deactivateButton"
  class="danger"
  type="button"
  disabled
>
Deactivate
</button>

</div>


<!-- ======================================================
     MESSAGE
======================================================= -->

<div
  id="message"
  class="message"
></div>


</div>

</div>


<script>


/************************************************************
 * ACTIVATION API
 *
 * IMPORTANT:
 *
 * This must be the /exec URL of the SEPARATE
 * ActivationAPI Apps Script project.
 *
 * It is NOT the ConnectionAPI URL entered during login.
 ************************************************************/

const ACTIVATION_API =
  "https://script.google.com/macros/s/AKfycbwE911qC9WwR_XGEmUiU9WlUBkLbw4Fduxq_kqHQsurtX3X41skLXfE3nJ1AElNe8jpEQ/exec";


/************************************************************
 * SESSION
 ************************************************************/

const scriptUrl =
  sessionStorage.getItem(
    "adminScriptUrl"
  );


const adminSession =
  sessionStorage.getItem(
    "adminSession"
  );


/************************************************************
 * DOM ELEMENTS
 ************************************************************/

const scriptDisplay =
  document.getElementById(
    "scriptDisplay"
  );


const statusDot =
  document.getElementById(
    "statusDot"
  );


const statusText =
  document.getElementById(
    "statusText"
  );


const activateButton =
  document.getElementById(
    "activateButton"
  );


const deactivateButton =
  document.getElementById(
    "deactivateButton"
  );


const logoutButton =
  document.getElementById(
    "logoutButton"
  );


const messageBox =
  document.getElementById(
    "message"
  );


/************************************************************
 * CHECK ADMIN SESSION EXISTS
 ************************************************************/

if (
  !scriptUrl ||
  !adminSession
) {

  window.location.replace(
    "index.html"
  );

}


/************************************************************
 * DISPLAY CONNECTION API
 ************************************************************/

scriptDisplay.textContent =
  scriptUrl || "";


/************************************************************
 * LOAD CURRENT ACTIVATION STATUS
 *
 * This checks the ACTUAL GitHub connection.json
 * through ActivationAPI.
 *
 * Therefore refreshing this page will NOT
 * automatically reset the UI to NOT ACTIVATED.
 ************************************************************/

async function loadActivationStatus(
  showStatusMessage = true
) {

  setCheckingState();


  try {

    const response =
      await fetch(
        ACTIVATION_API,
        {

          method:
            "POST",

          body:
            JSON.stringify({

              action:
                "status",

              scriptUrl:
                scriptUrl,

              adminSession:
                adminSession

            })

        }
      );


    if (!response.ok) {

      throw new Error(
        "Activation API HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    console.log(
      "Activation status:",
      data
    );


    /******************************************************
     * SESSION EXPIRED
     ******************************************************/

    if (
      data.sessionExpired === true
    ) {

      sessionExpired();

      return;

    }


    /******************************************************
     * STATUS FAILED
     ******************************************************/

    if (
      data.success !== true
    ) {

      setUnknownState();


      showMessage(
        data.message ||
        "Unable to check connection status.",
        false
      );


      return;

    }


    /******************************************************
     * CURRENT STATUS
     ******************************************************/

    updateStatus(
      data.active === true
    );


    if (
      showStatusMessage
    ) {

      if (
        data.active === true
      ) {

        showMessage(
          "Connection is currently active.",
          true
        );

      }

      else {

        showMessage(
          "Connection is currently inactive.",
          false
        );

      }

    }

  }

  catch (error) {

    console.error(
      "STATUS ERROR:",
      error
    );


    setUnknownState();


    showMessage(
      "Unable to check connection status.",
      false
    );

  }

}


/************************************************************
 * ACTIVATE CONNECTION
 ************************************************************/

async function activateConnection() {

  /*
   * Prevent double-clicking while
   * activation is processing.
   */

  setButtons(
    true
  );


  showMessage(
    "Establishing connection...",
    true
  );


  try {

    const response =
      await fetch(
        ACTIVATION_API,
        {

          method:
            "POST",

          body:
            JSON.stringify({

              action:
                "activate",

              scriptUrl:
                scriptUrl,

              adminSession:
                adminSession

            })

        }
      );


    if (!response.ok) {

      throw new Error(
        "Activation API HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    console.log(
      "Activation response:",
      data
    );


    /******************************************************
     * SESSION EXPIRED
     ******************************************************/

    if (
      data.sessionExpired === true
    ) {

      sessionExpired();

      return;

    }


    /******************************************************
     * ACTIVATION FAILED
     ******************************************************/

    if (
      data.success !== true
    ) {

      showMessage(
        data.message ||
        "Activation failed.",
        false
      );


      /*
       * Reload real status so buttons
       * don't remain disabled.
       */

      await loadActivationStatus(
        false
      );


      return;

    }


    /******************************************************
     * ACTIVATION SUCCESSFUL
     ******************************************************/

    updateStatus(
      true
    );


    showMessage(
      data.message ||
      "Connection activated successfully.",
      true
    );


    /*
     * Verify GitHub's actual state.
     */

    await loadActivationStatus(
      false
    );

  }

  catch (error) {

    console.error(
      "ACTIVATION ERROR:",
      error
    );


    showMessage(
      "Unable to activate connection.",
      false
    );


    /*
     * Recover button state.
     */

    await loadActivationStatus(
      false
    );

  }

}


/************************************************************
 * DEACTIVATE CONNECTION
 ************************************************************/

async function deactivateConnection() {

  const confirmed =
    confirm(
      "Deactivate the User connection?"
    );


  if (!confirmed) {

    return;

  }


  /*
   * Prevent double-clicking.
   */

  setButtons(
    true
  );


  showMessage(
    "Deactivating connection...",
    true
  );


  try {

    const response =
      await fetch(
        ACTIVATION_API,
        {

          method:
            "POST",

          body:
            JSON.stringify({

              action:
                "deactivate",

              scriptUrl:
                scriptUrl,

              adminSession:
                adminSession

            })

        }
      );


    if (!response.ok) {

      throw new Error(
        "Activation API HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    console.log(
      "Deactivation response:",
      data
    );


    /******************************************************
     * SESSION EXPIRED
     ******************************************************/

    if (
      data.sessionExpired === true
    ) {

      sessionExpired();

      return;

    }


    /******************************************************
     * DEACTIVATION FAILED
     ******************************************************/

    if (
      data.success !== true
    ) {

      showMessage(
        data.message ||
        "Deactivation failed.",
        false
      );


      await loadActivationStatus(
        false
      );


      return;

    }


    /******************************************************
     * DEACTIVATION SUCCESSFUL
     ******************************************************/

    updateStatus(
      false
    );


    showMessage(
      data.message ||
      "Connection deactivated.",
      true
    );


    /*
     * Confirm actual GitHub state.
     */

    await loadActivationStatus(
      false
    );

  }

  catch (error) {

    console.error(
      "DEACTIVATION ERROR:",
      error
    );


    showMessage(
      "Unable to deactivate connection.",
      false
    );


    /*
     * Recover button state.
     */

    await loadActivationStatus(
      false
    );

  }

}


/************************************************************
 * ACTIVE / INACTIVE UI
 ************************************************************/

function updateStatus(active) {

  if (active) {

    /******************************************************
     * ACTIVE
     ******************************************************/

    statusDot.className =
      "status-dot active";


    statusText.textContent =
      "ACTIVE";


    /*
     * Already active:
     *
     * Activate   = disabled
     * Deactivate = enabled
     */

    activateButton.disabled =
      true;


    deactivateButton.disabled =
      false;

  }

  else {

    /******************************************************
     * NOT ACTIVATED
     ******************************************************/

    statusDot.className =
      "status-dot inactive";


    statusText.textContent =
      "NOT ACTIVATED";


    /*
     * Currently inactive:
     *
     * Activate   = enabled
     * Deactivate = disabled
     */

    activateButton.disabled =
      false;


    deactivateButton.disabled =
      true;

  }

}


/************************************************************
 * CHECKING STATE
 ************************************************************/

function setCheckingState() {

  statusDot.className =
    "status-dot inactive";


  statusText.textContent =
    "CHECKING...";


  /*
   * Disable both until actual status
   * has been determined.
   */

  activateButton.disabled =
    true;


  deactivateButton.disabled =
    true;

}


/************************************************************
 * UNKNOWN STATE
 *
 * If status cannot be read, don't pretend
 * that the connection is deactivated.
 ************************************************************/

function setUnknownState() {

  statusDot.className =
    "status-dot inactive";


  statusText.textContent =
    "STATUS UNKNOWN";


  /*
   * Allow Activate as recovery option.
   *
   * Keep Deactivate disabled because we
   * don't know the current state.
   */

  activateButton.disabled =
    false;


  deactivateButton.disabled =
    true;

}


/************************************************************
 * DISABLE / ENABLE BOTH BUTTONS
 *
 * Primarily used while Activate or
 * Deactivate is processing.
 ************************************************************/

function setButtons(disabled) {

  activateButton.disabled =
    disabled;


  deactivateButton.disabled =
    disabled;

}


/************************************************************
 * LOGOUT
 ************************************************************/

async function logout() {

  /*
   * Disable logout while processing.
   */

  logoutButton.disabled =
    true;


  try {

    /*
     * Tell ConnectionAPI to invalidate
     * the temporary admin session.
     */

    await fetch(
      scriptUrl,
      {

        method:
          "POST",

        body:
          JSON.stringify({

            action:
              "adminLogout",

            sessionToken:
              adminSession

          })

      }
    );

  }

  catch (error) {

    /*
     * Even if server logout fails,
     * remove browser session.
     */

    console.warn(
      "Server logout failed:",
      error
    );

  }


  clearAdminSession();


  window.location.replace(
    "index.html"
  );

}


/************************************************************
 * SESSION EXPIRED
 ************************************************************/

function sessionExpired() {

  clearAdminSession();


  alert(
    "Administrator session expired. Please login again."
  );


  window.location.replace(
    "index.html"
  );

}


/************************************************************
 * CLEAR ADMIN SESSION
 ************************************************************/

function clearAdminSession() {

  sessionStorage.removeItem(
    "adminScriptUrl"
  );


  sessionStorage.removeItem(
    "adminSession"
  );

}


/************************************************************
 * MESSAGE
 ************************************************************/

function showMessage(
  text,
  success
) {

  messageBox.className =

    "message " +

    (
      success
        ? "success"
        : "error"
    );


  messageBox.textContent =
    text || "";

}


/************************************************************
 * EVENT LISTENERS
 ************************************************************/

activateButton.addEventListener(
  "click",
  activateConnection
);


deactivateButton.addEventListener(
  "click",
  deactivateConnection
);


logoutButton.addEventListener(
  "click",
  logout
);


/************************************************************
 * START
 *
 * IMPORTANT:
 *
 * Do NOT use:
 *
 *   updateStatus(false);
 *
 * here.
 *
 * The actual status must come from
 * GitHub through ActivationAPI.
 ************************************************************/

loadActivationStatus();


</script>


</body>

</html>
