<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Admin Login</title>

<link
  rel="stylesheet"
  href="style.css"
>

</head>


<body>


<div class="page">

<div class="card">


<div class="brand">
ADMIN
</div>


<h1>
Administrator Login
</h1>


<p class="subtitle">
Google Sheet Connection
</p>



<form id="loginForm">


<div class="field">

<label for="scriptId">
Google Script ID / Web App URL
</label>

<input
  id="scriptId"
  type="text"
  placeholder="Deployment ID or https://script.google.com/..."
  required
>

</div>



<div class="field">

<label for="username">
Admin Username
</label>

<input
  id="username"
  type="text"
  autocomplete="username"
  required
>

</div>



<div class="field">

<label for="password">
Admin Password
</label>

<input
  id="password"
  type="password"
  autocomplete="current-password"
  required
>

</div>



<button
  id="loginButton"
  type="submit"
>
Login
</button>


</form>



<div
  id="message"
  class="message"
></div>


</div>

</div>


<script src="admin.js"></script>


</body>

</html>
