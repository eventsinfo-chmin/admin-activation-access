<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Admin Login</title>

<link
  rel="stylesheet"
  href="style.css"
>

</head>


<body>


<div class="page">

<div class="card">


<div class="brand">
ADMIN
</div>


<h1>
Administrator Login
</h1>


<p class="subtitle">
Connection Management
</p>


<form
  id="loginForm"
  autocomplete="off"
>


<div class="field">

<label for="password">
Admin Password
</label>

<input
  id="password"
  type="password"
  placeholder="Enter administrator password"
  autocomplete="current-password"
  required
>

</div>


<button
  id="loginButton"
  type="submit"
>

Login

</button>


</form>


<div
  id="message"
  class="message"
></div>


</div>

</div>


<script src="admin.js"></script>


</body>

</html>
